<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests" />
<meta name="description" content="The Arcade — five hand-built HTML5 canvas games: Snake, Breakout, Duck Hop, Asteroids and 2048. No frameworks, no ads, just play. High scores stay on your device." />
<title>Arcade — Brendon James Kirk</title>
<link rel="canonical" href="https://bkirk.eu/arcade.html" />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://bkirk.eu/arcade.html" />
<meta property="og:title" content="Arcade — Brendon James Kirk" />
<meta property="og:description" content="Five hand-built HTML5 canvas games — Snake, Breakout, Duck Hop, Asteroids, 2048. No frameworks, no ads, just play." />
<meta property="og:image" content="https://bkirk.eu/assets/bj.webp" />
<meta property="og:site_name" content="Brendon James Kirk" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="stylesheet" href="css/fonts.css" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
<link rel="manifest" href="site.webmanifest" />
<meta name="theme-color" content="#05080d" />
<style>
  :root{
    --ink: rgba(226,236,246,0.92);
    --ink-dim: rgba(170,190,210,0.55);
    --line: rgba(150,180,210,0.16);
    --line-bright: rgba(150,190,230,0.40);
    --glass: rgba(14,20,30,0.42);
    --cyan: oklch(0.82 0.11 220);
    --sans: 'Space Grotesk', system-ui, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; width:100%; overflow:hidden; background:#05080d; }
  body{ font-family:var(--sans); color:var(--ink); -webkit-font-smoothing:antialiased; }

  #game{ position:fixed; inset:0; width:100%; height:100%; display:block; touch-action:none; }

  .hud{ position:fixed; z-index:10; transition:opacity .35s ease, transform .35s ease; }
  body.ui-hidden .hud{ opacity:0; pointer-events:none; transform:translateY(6px); }

  #brand{ top:26px; left:30px; }
  #brand .kicker{
    font-family:var(--mono); font-size:11px; letter-spacing:.34em; text-transform:uppercase;
    color:var(--ink-dim); display:flex; align-items:center; gap:9px;
  }
  #brand .dot{ width:6px; height:6px; border-radius:50%; background:var(--cyan);
    box-shadow:0 0 10px 1px var(--cyan); animation:pulse 2.6s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ opacity:.55 } 50%{ opacity:1 } }
  #brand .title{ margin-top:9px; font-size:21px; font-weight:600; letter-spacing:-.01em; }
  #brand .hint{ margin-top:4px; font-family:var(--mono); font-size:11.5px; color:var(--ink-dim); letter-spacing:.02em; }
  #brand .back{
    display:inline-block; margin-top:14px;
    font-family:var(--mono); font-size:11px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--ink-dim); text-decoration:none;
    border:1px solid var(--line); border-radius:10px; padding:8px 13px;
    background:var(--glass); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    transition:color .2s, border-color .2s;
  }
  #brand .back:hover{ color:var(--ink); border-color:var(--line-bright); }

  #readout{ top:26px; right:30px; text-align:right; font-family:var(--mono); }
  #readout .label{ font-size:10px; letter-spacing:.3em; text-transform:uppercase; color:var(--ink-dim); }
  #readout .score{ margin-top:8px; font-size:26px; font-weight:500; color:var(--ink); letter-spacing:.06em; }
  #readout .bestrow{ margin-top:4px; font-size:11px; color:var(--ink-dim); letter-spacing:.18em; }
  #readout .bestrow b{ color:var(--cyan); font-weight:500; }

  #dock{ left:50%; bottom:30px; transform:translateX(-50%); }
  body.ui-hidden #dock{ transform:translateX(-50%) translateY(6px); }
  @media (max-width: 900px){ #dock{ bottom:88px; } }
  .seg{
    display:flex; align-items:stretch; gap:4px; padding:5px;
    flex-wrap:wrap; justify-content:center; max-width:min(92vw, 860px);
    background:var(--glass); border:1px solid var(--line); border-radius:14px;
    backdrop-filter:blur(16px) saturate(1.2); -webkit-backdrop-filter:blur(16px) saturate(1.2);
    box-shadow:0 12px 40px -12px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.04);
  }
  .seg button{
    appearance:none; border:0; background:transparent; cursor:pointer; color:var(--ink-dim);
    font-family:var(--sans); font-size:13px; font-weight:500; letter-spacing:.01em;
    padding:9px 13px; border-radius:10px; position:relative; transition:color .2s ease, background .2s ease;
    display:flex; flex-direction:column; align-items:center; gap:3px; min-width:64px;
  }
  .seg button .n{ font-family:var(--mono); font-size:9px; letter-spacing:.22em; opacity:.6; }
  .seg button:hover{ color:var(--ink); }
  .seg button.active{ color:#06121c; background:linear-gradient(180deg, oklch(0.86 0.10 220), oklch(0.74 0.12 222));
    box-shadow:0 4px 16px -6px var(--cyan); }
  .seg button.active .n{ opacity:.7; }

  #ctl{ right:30px; bottom:30px; display:flex; gap:6px; }
  #ctl button{
    appearance:none; cursor:pointer; font-family:var(--mono); font-size:11px; letter-spacing:.14em;
    color:var(--ink-dim); background:var(--glass); border:1px solid var(--line); border-radius:10px;
    padding:10px 12px; backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); transition:color .2s, border-color .2s;
  }
  #ctl button:hover{ color:var(--ink); border-color:var(--line-bright); }

  #peek{ position:fixed; z-index:11; left:50%; bottom:16px; transform:translateX(-50%);
    font-family:var(--mono); font-size:10.5px; letter-spacing:.2em; color:var(--ink-dim);
    padding:10px 18px; border-radius:999px; border:1px solid var(--line);
    background:var(--glass); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    opacity:0; transition:opacity .35s ease; pointer-events:none; text-transform:uppercase; cursor:pointer; }
  #peek:hover{ color:var(--ink); }
  body.ui-hidden #peek{ opacity:.85; pointer-events:auto; }

  /* during active play the chrome gets out of the way; the score stays */
  body.playing #brand, body.playing #dock, body.playing #ctl{
    opacity:0; pointer-events:none; transform:translateY(6px);
  }
  body.playing #readout{ pointer-events:none; }

  #fader{
    position:fixed; inset:0; z-index:5; background:#05080d;
    opacity:0; pointer-events:none; transition:opacity .28s ease;
  }
  #fader.show{ opacity:1; }

  /* how-to-play card, shown before each game */
  #howto{
    position:fixed; inset:0; z-index:9; display:grid; place-items:center;
    pointer-events:none; opacity:0; transition:opacity .3s ease;
  }
  #howto.show{ opacity:1; }
  #howto .ht-card{
    width:min(88vw, 360px); padding:26px 28px 22px;
    background:rgba(10,15,24,0.88); border:1px solid var(--line-bright); border-radius:16px;
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    box-shadow:0 24px 70px -20px rgba(0,0,0,0.8);
    transform:translateY(10px); transition:transform .3s ease;
  }
  #howto.show .ht-card{ transform:none; }
  #howto .ht-kicker{
    font-family:var(--mono); font-size:10px; letter-spacing:.30em;
    text-transform:uppercase; color:var(--cyan);
  }
  #howto h2{ margin-top:8px; font-size:26px; font-weight:600; letter-spacing:-.01em; }
  #howto .ht-goal{ margin-top:8px; font-size:13px; line-height:1.55; color:var(--ink-dim); }
  #howto .ht-controls{ margin-top:16px; display:flex; flex-direction:column; gap:8px; }
  #howto .ht-row{ display:flex; align-items:center; gap:12px; }
  #howto .ht-key{
    flex:0 0 auto; font-family:var(--mono); font-size:10.5px; letter-spacing:.06em;
    color:var(--ink); background:rgba(150,190,230,0.08);
    border:1px solid var(--line-bright); border-radius:7px; padding:4px 9px;
  }
  #howto .ht-act{ font-size:12.5px; color:var(--ink-dim); }
  #howto .ht-start{
    margin-top:18px; font-family:var(--mono); font-size:11px; letter-spacing:.22em;
    text-transform:uppercase; color:var(--cyan); animation:htpulse 1.6s ease-in-out infinite;
  }
  @keyframes htpulse{ 0%,100%{ opacity:.5 } 50%{ opacity:1 } }

  /* ---- Leaderboard overlay ---- */
  #lb{
    position:fixed; inset:0; z-index:12; display:none; place-items:center;
    background:rgba(5,8,13,0.72); backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px);
    padding:20px;
  }
  #lb.show{ display:grid; }
  .lb-card{
    position:relative; width:min(92vw, 420px); max-height:86vh; overflow-y:auto;
    padding:28px 28px 24px;
    background:rgba(10,15,24,0.92); border:1px solid var(--line-bright); border-radius:18px;
    backdrop-filter:blur(18px); -webkit-backdrop-filter:blur(18px);
    box-shadow:0 30px 80px -22px rgba(0,0,0,0.85);
  }
  .lb-x{
    position:absolute; top:14px; right:14px; appearance:none; cursor:pointer;
    width:34px; height:34px; border-radius:9px; color:var(--ink-dim);
    background:transparent; border:1px solid var(--line); font-size:14px;
    transition:color .2s, border-color .2s;
  }
  .lb-x:hover{ color:var(--ink); border-color:var(--line-bright); }
  .lb-kicker{ font-family:var(--mono); font-size:10px; letter-spacing:.30em; text-transform:uppercase; color:var(--cyan); }
  #lbTitle{ margin-top:8px; font-size:24px; font-weight:600; letter-spacing:-.01em; }
  .lb-list{ list-style:none; margin:20px 0 0; }
  .lb-list li{
    display:grid; grid-template-columns:26px 1fr auto; align-items:center; gap:14px;
    padding:11px 4px; border-bottom:1px solid var(--line);
    font-family:var(--mono); font-size:14px;
  }
  .lb-list li:last-child{ border-bottom:0; }
  .lb-list .rank{ color:var(--ink-dim); font-size:12px; text-align:right; }
  .lb-list .who{ color:var(--ink); letter-spacing:.14em; font-weight:500; }
  .lb-list .pts{ color:var(--cyan); letter-spacing:.04em; }
  .lb-list li.you{ background:rgba(84,200,255,0.09); border-radius:8px; }
  .lb-list li.you .who{ color:#bfe9ff; }
  .lb-empty{ padding:18px 4px; color:var(--ink-dim); font-family:var(--mono); font-size:12.5px; line-height:1.6; }
  .lb-state{ margin-top:14px; font-family:var(--mono); font-size:11.5px; color:var(--ink-dim); line-height:1.6; }
  .lb-state.err{ color:#ff9a8c; }

  .lb-entry{ margin-top:20px; padding-top:18px; border-top:1px solid var(--line-bright); }
  .lb-congrats{ font-size:14px; color:var(--ink); }
  .lb-congrats b{ color:var(--cyan); }
  .lb-inputs{ display:flex; gap:10px; margin-top:12px; }
  #lbInitials{
    flex:1; min-width:0; text-transform:uppercase; letter-spacing:.32em;
    font-family:var(--mono); font-size:20px; text-align:center; color:var(--ink);
    background:rgba(150,190,230,0.07); border:1px solid var(--line-bright); border-radius:11px;
    padding:12px 10px;
  }
  #lbInitials:focus{ outline:none; border-color:var(--cyan); box-shadow:0 0 0 3px rgba(84,200,255,0.18); }
  .lb-btn{
    appearance:none; cursor:pointer; font-family:var(--mono); font-size:12px; letter-spacing:.12em;
    text-transform:uppercase; color:var(--ink); background:var(--glass);
    border:1px solid var(--line-bright); border-radius:11px; padding:12px 18px;
    transition:color .2s, border-color .2s, background .2s;
  }
  .lb-btn:hover{ border-color:var(--cyan); }
  .lb-btn.primary{ background:linear-gradient(180deg, oklch(0.86 0.10 220), oklch(0.74 0.12 222)); color:#06121c; border-color:transparent; font-weight:600; }
  .lb-btn.primary:disabled{ opacity:.5; cursor:progress; }
  .lb-err{ margin-top:10px; font-family:var(--mono); font-size:11.5px; color:#ff9a8c; min-height:1em; }
</style>
</head>
<body>
  <canvas id="game"></canvas>

  <div id="brand" class="hud">
    <div class="kicker"><span class="dot"></span>BK // ARCADE</div>
    <div class="title" id="gName">Snake</div>
    <div class="hint" id="gHint"></div>
    <a class="back" href="index.html">← Back to site</a>
    <a class="back" href="legal.html">Imprint &amp; Privacy</a>
  </div>

  <div id="readout" class="hud">
    <div class="label">Score</div>
    <div class="score" id="gScore">0</div>
    <div class="bestrow">BEST <b id="gBest">0</b></div>
  </div>

  <nav id="dock" class="hud"><div class="seg" id="seg"></div></nav>

  <div id="ctl" class="hud">
    <button id="board" title="Leaderboard — L">BOARD</button>
    <button id="fs" title="Fullscreen — F">FULL</button>
    <button id="hide" title="Hide interface — H">HIDE</button>
  </div>
  <div id="peek">tap here or press H for controls</div>
  <div id="fader"></div>

  <div id="howto" aria-live="polite">
    <div class="ht-card">
      <p class="ht-kicker">// How to play</p>
      <h2 id="htTitle"></h2>
      <p class="ht-goal" id="htGoal"></p>
      <div class="ht-controls" id="htControls"></div>
      <p class="ht-start">press any key or tap to play</p>
    </div>
  </div>

  <div id="lb" role="dialog" aria-modal="true" aria-label="Leaderboard" aria-hidden="true">
    <div class="lb-card">
      <button id="lbClose" class="lb-x" aria-label="Close leaderboard">✕</button>
      <p class="lb-kicker">// Global leaderboard</p>
      <h2 id="lbTitle">Top 10</h2>
      <ol id="lbList" class="lb-list"></ol>
      <p id="lbState" class="lb-state"></p>
      <form id="lbEntry" class="lb-entry" hidden>
        <p class="lb-congrats" id="lbCongrats">You made the board!</p>
        <div class="lb-inputs">
          <input id="lbInitials" maxlength="3" inputmode="text" autocomplete="off"
                 autocapitalize="characters" spellcheck="false"
                 aria-label="Your initials (up to 3 characters)" placeholder="AAA" />
          <button id="lbSubmit" class="lb-btn primary" type="submit">Submit</button>
        </div>
        <p id="lbErr" class="lb-err" role="alert"></p>
      </form>
    </div>
  </div>

  <script src="js/arcade/leaderboard.js"></script>
  <script src="js/arcade/game-snake.js"></script>
  <script src="js/arcade/game-breakout.js"></script>
  <script src="js/arcade/game-duck.js"></script>
  <script src="js/arcade/game-asteroids.js"></script>
  <script src="js/arcade/game-2048.js"></script>
  <script>
  (function () {
    const canvas = document.getElementById('game');
    const ctx = canvas.getContext('2d');
    const ORDER = ['snake', 'breakout', 'duck', 'asteroids', '2048'];
    const LIST = ORDER.map(k => window.GAMES[k]);

    let W = 0, H = 0, dpr = 1;
    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      W = window.innerWidth; H = window.innerHeight;
      canvas.width = Math.round(W * dpr);
      canvas.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      if (current && current.resize) current.resize();
    }
    window.addEventListener('resize', resize);

    // ---- shell API handed to each game ----
    let score = 0, best = 0, curKey = '', wasPlaying = false;
    const scoreEl = document.getElementById('gScore');
    const bestEl = document.getElementById('gBest');
    const shell = {
      canvas, ctx,
      get w() { return W; },
      get h() { return H; },
      signal: null,
      setScore(n) {
        score = n;
        scoreEl.textContent = String(n);
        if (n > best) {
          best = n;
          bestEl.textContent = String(n);
          try { localStorage.setItem('arcade.best.' + curKey, String(n)); } catch (e) {}
        }
      },
      // games flag active play so the chrome ducks out of the way;
      // the play→over transition is the single hook for the leaderboard
      playing(v) {
        document.body.classList.toggle('playing', !!v);
        if (v) { wasPlaying = true; hideHowto(); }
        else if (wasPlaying) {
          wasPlaying = false;
          if (window.Leaderboard) window.Leaderboard.gameOver(curKey, score);
        }
      },
    };

    // ---- how-to-play card: shown on every game entry, gone on first input ----
    const howtoEl = document.getElementById('howto');
    function showHowto(game) {
      if (!game.howto) { howtoEl.classList.remove('show'); return; }
      document.getElementById('htTitle').textContent = game.name;
      document.getElementById('htGoal').textContent = game.howto.goal;
      const box = document.getElementById('htControls');
      box.innerHTML = '';
      for (const pair of game.howto.controls) {
        const row = document.createElement('div');
        row.className = 'ht-row';
        const k = document.createElement('span');
        k.className = 'ht-key'; k.textContent = pair[0];
        const a = document.createElement('span');
        a.className = 'ht-act'; a.textContent = pair[1];
        row.appendChild(k); row.appendChild(a);
        box.appendChild(row);
      }
      howtoEl.classList.add('show');
    }
    function hideHowto() { howtoEl.classList.remove('show'); }
    window.addEventListener('keydown', () => hideHowto());
    window.addEventListener('pointerdown', (e) => { if (e.target === canvas) hideHowto(); });

    // ---- switching ----
    let current = null, curIdx = 0, fading = false, controller = null;
    const fader = document.getElementById('fader');
    const seg = document.getElementById('seg');

    function activate(idx, save) {
      if (current) {
        current.stop();
        if (controller) controller.abort();
      }
      curIdx = idx;
      curKey = ORDER[idx];
      document.body.classList.remove('playing');
      const game = LIST[idx];
      current = game;
      controller = new AbortController();
      shell.signal = controller.signal;
      score = 0;
      try { best = parseInt(localStorage.getItem('arcade.best.' + curKey) || '0', 10) || 0; } catch (e) { best = 0; }
      scoreEl.textContent = '0';
      bestEl.textContent = String(best);
      document.getElementById('gName').textContent = game.name;
      document.getElementById('gHint').textContent = game.hint;
      [...seg.children].forEach((b, i) => b.classList.toggle('active', i === idx));
      if (save !== false) {
        try { localStorage.setItem('arcade.last', curKey); } catch (e) {}
        try { history.replaceState(null, '', '#' + curKey); } catch (e) {}
      }
      showHowto(game);
      game.start(shell);
      if (window.Leaderboard) window.Leaderboard.setGame(curKey);
    }

    function switchTo(idx, save) {
      if (fading || LIST[idx] === current) return;
      fading = true;
      fader.classList.add('show');
      setTimeout(() => {
        activate(idx, save);
        fader.classList.remove('show');
        fading = false;
      }, 300);
    }

    function hashIndex() {
      const h = decodeURIComponent(location.hash.slice(1)).toLowerCase();
      if (!h) return -1;
      const byKey = ORDER.indexOf(h);
      if (byKey >= 0) return byKey;
      return LIST.findIndex((g) => g.id === h || g.name.toLowerCase() === h);
    }
    window.addEventListener('hashchange', () => {
      const i = hashIndex();
      if (i >= 0) switchTo(i);
    });

    // dock
    LIST.forEach((g, i) => {
      const b = document.createElement('button');
      b.innerHTML = '<span class="t">' + g.name + '</span><span class="n">' + String(i + 1).padStart(2, '0') + '</span>';
      b.addEventListener('click', () => { b.blur(); switchTo(i); });
      seg.appendChild(b);
    });

    // controls
    document.getElementById('hide').addEventListener('click', function () {
      this.blur(); document.body.classList.toggle('ui-hidden');
    });
    document.getElementById('peek').addEventListener('click', () => {
      document.body.classList.remove('ui-hidden');
    });
    document.getElementById('fs').addEventListener('click', function () {
      this.blur();
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen().catch(() => {});
    });
    document.getElementById('board').addEventListener('click', function () {
      this.blur(); if (window.Leaderboard) window.Leaderboard.show(curKey);
    });

    // shell keys: 1-5 pick a game, [ ] cycle, F fullscreen, H hide UI.
    // Everything else belongs to the games.
    window.addEventListener('keydown', (e) => {
      if (e.target && e.target.tagName === 'INPUT') return;
      if (e.key === 'h' || e.key === 'H') document.getElementById('hide').click();
      else if (e.key === 'f' || e.key === 'F') document.getElementById('fs').click();
      else if (e.key === 'l' || e.key === 'L') document.getElementById('board').click();
      else if (e.key === '[') switchTo((curIdx + LIST.length - 1) % LIST.length);
      else if (e.key === ']') switchTo((curIdx + 1) % LIST.length);
      else if (e.key >= '1' && e.key <= '5') switchTo(parseInt(e.key, 10) - 1);
    });

    // keep arrows/space from scrolling or re-clicking focused buttons
    window.addEventListener('keydown', (e) => {
      if ([' ', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight'].includes(e.key)) e.preventDefault();
    });

    // boot
    resize();
    let startIdx = 0;
    const hi = hashIndex();
    if (hi >= 0) startIdx = hi;
    else try { const saved = localStorage.getItem('arcade.last'); const si = ORDER.indexOf(saved); if (si >= 0) startIdx = si; } catch (e) {}
    activate(startIdx, false);
  })();
  </script>
</body>
</html>
