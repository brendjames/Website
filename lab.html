<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; form-action 'self'; base-uri 'self'; object-src 'none'; upgrade-insecure-requests" />
<meta name="description" content="The Shader Lab — fifteen interactive WebGL2 wallpapers, from rippling water and auroras to living coral, a bass-fed music visualiser, and a Milkdrop homage that rolls a brand-new universe every 30 seconds. Fullscreen it, download frames, or feed it a song." />
<title>Shader Lab — Brendon James Kirk</title>
<link rel="canonical" href="https://bkirk.eu/lab.html" />
<meta property="og:type" content="website" />
<meta property="og:url" content="https://bkirk.eu/lab.html" />
<meta property="og:title" content="Shader Lab — Brendon James Kirk" />
<meta property="og:description" content="Fifteen interactive WebGL2 wallpapers — from rippling water and auroras to a bass-fed music visualiser and a Milkdrop homage that reinvents itself every 30 seconds. Fullscreen it, download frames, or feed it a song." />
<meta property="og:image" content="https://bkirk.eu/assets/bj.webp" />
<meta property="og:site_name" content="Brendon James Kirk" />
<meta name="twitter:card" content="summary_large_image" />
<link rel="stylesheet" href="css/fonts.css" />
<link rel="icon" href="favicon.svg" type="image/svg+xml" />
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png" />
<link rel="manifest" href="site.webmanifest" />
<meta name="theme-color" content="#05080d" />
<style>
  :root{
    --ink: rgba(226,236,246,0.92);
    --ink-dim: rgba(170,190,210,0.55);
    --line: rgba(150,180,210,0.16);
    --line-bright: rgba(150,190,230,0.40);
    --glass: rgba(14,20,30,0.42);
    --cyan: oklch(0.82 0.11 220);
    --sans: 'Space Grotesk', system-ui, sans-serif;
    --mono: 'IBM Plex Mono', ui-monospace, monospace;
  }
  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; width:100%; overflow:hidden; background:#05080d; }
  body{ font-family:var(--sans); color:var(--ink); -webkit-font-smoothing:antialiased; }

  #stage{ position:fixed; inset:0; }
  #gl{ display:block; width:100%; height:100%; cursor:crosshair; }

  /* ---- HUD chrome ---- */
  .hud{ position:fixed; z-index:10; transition:opacity .35s ease, transform .35s ease; }
  body.ui-hidden .hud{ opacity:0; pointer-events:none; transform:translateY(6px); }

  /* top-left identity */
  #brand{ top:26px; left:30px; }
  #brand .kicker{
    font-family:var(--mono); font-size:11px; letter-spacing:.34em; text-transform:uppercase;
    color:var(--ink-dim); display:flex; align-items:center; gap:9px;
  }
  #brand .dot{ width:6px; height:6px; border-radius:50%; background:var(--cyan);
    box-shadow:0 0 10px 1px var(--cyan); animation:pulse 2.6s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{ opacity:.55 } 50%{ opacity:1 } }
  #brand .title{ margin-top:9px; font-size:21px; font-weight:600; letter-spacing:-.01em; }
  #brand .hint{ margin-top:4px; font-family:var(--mono); font-size:11.5px; color:var(--ink-dim); letter-spacing:.02em; }
  #brand .back{
    display:inline-block; margin-top:14px;
    font-family:var(--mono); font-size:11px; letter-spacing:.16em; text-transform:uppercase;
    color:var(--ink-dim); text-decoration:none;
    border:1px solid var(--line); border-radius:10px; padding:8px 13px;
    background:var(--glass); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    transition:color .2s, border-color .2s;
  }
  #brand .back:hover{ color:var(--ink); border-color:var(--line-bright); }

  /* top-right readout */
  #readout{ top:26px; right:30px; text-align:right; font-family:var(--mono); }
  #readout .label{ font-size:10px; letter-spacing:.3em; text-transform:uppercase; color:var(--ink-dim); }
  #meter{ margin-top:8px; width:124px; height:3px; border-radius:3px; background:rgba(150,180,210,0.14);
    overflow:hidden; margin-left:auto; }
  #meter > i{ display:block; height:100%; width:0%; background:linear-gradient(90deg, transparent, var(--cyan));
    transition:width .08s linear; }
  #readout .idx{ margin-top:10px; font-size:11px; color:var(--ink-dim); letter-spacing:.18em; }
  #readout .idx b{ color:var(--ink); font-weight:500; }

  /* bottom switcher */
  #dock{ left:50%; bottom:30px; transform:translateX(-50%); }
  body.ui-hidden #dock{ transform:translateX(-50%) translateY(6px); }
  @media (max-width: 900px){ #dock{ bottom:88px; } }  /* clear the control row */
  .seg{
    display:flex; align-items:stretch; gap:4px; padding:5px;
    flex-wrap:wrap; justify-content:center; max-width:min(92vw, 860px);
    background:var(--glass); border:1px solid var(--line); border-radius:14px;
    backdrop-filter:blur(16px) saturate(1.2); -webkit-backdrop-filter:blur(16px) saturate(1.2);
    box-shadow:0 12px 40px -12px rgba(0,0,0,0.7), inset 0 1px 0 rgba(255,255,255,0.04);
  }
  .seg button{
    appearance:none; border:0; background:transparent; cursor:pointer; color:var(--ink-dim);
    font-family:var(--sans); font-size:13px; font-weight:500; letter-spacing:.01em;
    padding:9px 13px; border-radius:10px; position:relative; transition:color .2s ease, background .2s ease;
    display:flex; flex-direction:column; align-items:center; gap:3px; min-width:64px;
  }
  .seg button .n{ font-family:var(--mono); font-size:9px; letter-spacing:.22em; opacity:.6; }
  .seg button:hover{ color:var(--ink); }
  .seg button.active{ color:#06121c; background:linear-gradient(180deg, oklch(0.86 0.10 220), oklch(0.74 0.12 222));
    box-shadow:0 4px 16px -6px var(--cyan); }
  .seg button.active .n{ opacity:.7; }

  /* control cluster, bottom-right */
  #ctl{ right:30px; bottom:30px; display:flex; gap:6px; }
  #ctl button{
    appearance:none; cursor:pointer; font-family:var(--mono); font-size:11px; letter-spacing:.14em;
    color:var(--ink-dim); background:var(--glass); border:1px solid var(--line); border-radius:10px;
    padding:10px 12px; backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); transition:color .2s, border-color .2s;
  }
  #ctl button:hover{ color:var(--ink); border-color:var(--line-bright); }
  #ctl button.on{
    color:#06121c; border-color:transparent;
    background:linear-gradient(180deg, oklch(0.86 0.10 220), oklch(0.74 0.12 222));
  }

  /* hue dial, bottom-left */
  #hueCtl{
    left:30px; bottom:30px; display:flex; align-items:center; gap:10px;
    font-family:var(--mono); font-size:10px; letter-spacing:.24em; color:var(--ink-dim);
    background:var(--glass); border:1px solid var(--line); border-radius:10px; padding:10px 14px;
    backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  }
  #hueCtl input{ width:110px; accent-color: oklch(0.82 0.11 220); cursor:pointer; }

  /* crossfade veil between shaders */
  #fader{
    position:fixed; inset:0; z-index:5; background:#05080d;
    opacity:0; pointer-events:none; transition:opacity .28s ease;
  }
  #fader.show{ opacity:1; }

  /* show-again pill when UI hidden */
  #peek{ position:fixed; z-index:11; left:50%; bottom:16px; transform:translateX(-50%);
    font-family:var(--mono); font-size:10.5px; letter-spacing:.2em; color:var(--ink-dim);
    padding:10px 18px; border-radius:999px; border:1px solid var(--line);
    background:var(--glass); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
    opacity:0; transition:opacity .35s ease; pointer-events:none; text-transform:uppercase; cursor:pointer; }
  #peek:hover{ color:var(--ink); }
  body.ui-hidden #peek{ opacity:.85; pointer-events:auto; }

  #fallback{ position:fixed; inset:0; display:none; place-items:center; text-align:center;
    font-family:var(--mono); color:var(--ink-dim); font-size:13px; padding:40px; }
  body.no-webgl #fallback{ display:grid; }
  body.no-webgl .hud{ display:none; }
  #fallback a{ color:var(--ink); }
</style>
</head>
<body>
  <div id="stage"><canvas id="gl"></canvas></div>

  <div id="brand" class="hud">
    <div class="kicker"><span class="dot"></span>BK // SHADER LAB</div>
    <div class="title" id="wpName">Ripple</div>
    <div class="hint" id="wpHint">Drag to push the water · click to drop a stone</div>
    <a class="back" href="index.html">← Back to site</a>
    <a class="back" href="legal.html">Imprint &amp; Privacy</a>
  </div>

  <div id="readout" class="hud">
    <div class="label">Cursor Velocity</div>
    <div id="meter"><i></i></div>
    <div class="idx"><b id="idxNum">01</b> / 15</div>
  </div>

  <nav id="dock" class="hud"><div class="seg" id="seg"></div></nav>

  <div id="hueCtl" class="hud">
    <span>HUE</span>
    <input id="hue" type="range" min="0" max="360" value="0" step="1" aria-label="Hue shift" />
  </div>

  <div id="ctl" class="hud">
    <button id="mic" title="React to sound — M">MIC</button>
    <button id="auto" title="Auto-cycle shaders — A">AUTO</button>
    <button id="save" title="Download this frame as a wallpaper — S">SAVE</button>
    <button id="fs" title="Fullscreen — F">FULL</button>
    <button id="hide" title="Hide interface — H">HIDE</button>
  </div>
  <div id="peek">tap here or press H for controls</div>
  <div id="fader"></div>

  <div id="fallback">This lab needs WebGL2.<br/>Try a current Chrome, Edge, Firefox or Safari — or head <a href="index.html">back to the site</a>.</div>

  <script src="js/lab/gl-engine.js"></script>
  <script src="js/lab/wp-ripples.js"></script>
  <script src="js/lab/wp-plasma.js"></script>
  <script src="js/lab/wp-particles.js"></script>
  <script src="js/lab/wp-voronoi.js"></script>
  <script src="js/lab/wp-aurora.js"></script>
  <script src="js/lab/wp-mercury.js"></script>
  <script src="js/lab/wp-led.js"></script>
  <script src="js/lab/wp-ember.js"></script>
  <script src="js/lab/wp-synth.js"></script>
  <script src="js/lab/wp-glyphs.js"></script>
  <script src="js/lab/wp-coral.js"></script>
  <script src="js/lab/wp-circuit.js"></script>
  <script src="js/lab/wp-kaleido.js"></script>
  <script src="js/lab/wp-music.js"></script>
  <script src="js/lab/wp-milkdrop.js"></script>
  <script>
  (function () {
    const canvas = document.getElementById('gl');
    let gl;
    try { gl = Engine.createGL(canvas); }
    catch (e) { document.body.classList.add('no-webgl'); console.warn(e); return; }

    const ORDER = ['ripples', 'plasma', 'particles', 'voronoi',
                   'aurora', 'mercury', 'led', 'ember', 'synth',
                   'glyphs', 'coral', 'circuit', 'kaleido', 'music', 'milkdrop'];
    const LIST = ORDER.map(k => window.WP[k]);
    const quad = Engine.quad(gl);

    const DPR_CAP = 1.5;
    let W = 0, H = 0, dpr = 1;

    // ---- input state ----
    const input = {
      mouse: [0.5, 0.5], pmouse: [0.5, 0.5], vel: [0, 0], speed: 0,
      mousePx: [0, 0], velPx: [0, 0], down: false,
      click: { pos: [0.5, 0.5], energy: 0 }, clickAge: 0,
    };
    let curN = [0.5, 0.5], lastN = [0.5, 0.5];
    let curPx = [0, 0], lastPx = [0, 0];
    let clickStart = -10;
    let lastRealInput = performance.now();

    function setFromEvent(e) {
      const r = canvas.getBoundingClientRect();
      const x = (e.clientX - r.left) / r.width;
      const y = (e.clientY - r.top) / r.height;
      curN = [Math.min(1, Math.max(0, x)), Math.min(1, Math.max(0, 1 - y))];
      curPx = [curN[0] * W, (1 - curN[1]) * H];
      lastRealInput = performance.now();
    }
    window.addEventListener('pointermove', setFromEvent, { passive: true });
    window.addEventListener('pointerdown', (e) => {
      if (e.target && e.target.closest && e.target.closest('a, button, input, label, #peek')) return; // keep HUD clickable
      setFromEvent(e);
      input.down = true;
      input.click.pos = curN.slice();
      input.click.energy = 1;
      clickStart = time;
    });
    window.addEventListener('pointerup', () => { input.down = false; });
    window.addEventListener('pointercancel', () => { input.down = false; });

    // ---- env passed to wallpapers ----
    const env = { gl, canvas, quad, input, time: 0, dt: 0, W: 0, H: 0, dpr: 1 };

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, DPR_CAP);
      const cw = canvas.clientWidth || window.innerWidth;
      const ch = canvas.clientHeight || window.innerHeight;
      W = Math.max(2, Math.round(cw * dpr));
      H = Math.max(2, Math.round(ch * dpr));
      canvas.width = W; canvas.height = H;
      env.W = W; env.H = H; env.dpr = dpr;
      if (active && initialized.has(active.id)) active.resize && active.resize(env);
    }
    window.addEventListener('resize', resize);

    // ---- wallpaper switching ----
    const initialized = new Set();
    let active = null, curIdx = 0, lastSwitch = 0, fading = false;
    const fader = document.getElementById('fader');

    function activate(idx, save) {
      const next = LIST[idx];
      if (active === next) return;
      active = next;
      curIdx = idx;
      lastSwitch = time;
      env.W = W; env.H = H; env.dpr = dpr;
      if (!initialized.has(next.id)) { next.setup(env); initialized.add(next.id); }
      next.resize && next.resize(env);
      // reset transient input so a new shader starts calm
      input.click.energy = 0;
      // UI
      document.getElementById('wpName').textContent = next.name;
      document.getElementById('wpHint').textContent = next.hint;
      document.getElementById('idxNum').textContent = String(idx + 1).padStart(2, '0');
      [...seg.children].forEach((b, i) => b.classList.toggle('active', i === idx));
      if (save !== false) {
        try { localStorage.setItem('wp.active', ORDER[idx]); } catch (e) {}
        try { history.replaceState(null, '', '#' + ORDER[idx]); } catch (e) {}
      }
      // Music feeds on the microphone — offer it as soon as the shader opens
      if (ORDER[idx] === 'music' && !audio) toggleMic();
    }

    // dip to black, switch, dip back up
    function switchTo(idx, save) {
      if (fading || LIST[idx] === active) return;
      fading = true;
      fader.classList.add('show');
      setTimeout(() => {
        activate(idx, save);
        fader.classList.remove('show');
        fading = false;
      }, 300);
    }

    // deep links: lab.html#storm, #void, #cells...
    function hashIndex() {
      const h = decodeURIComponent(location.hash.slice(1)).toLowerCase();
      if (!h) return -1;
      const byKey = ORDER.indexOf(h);
      if (byKey >= 0) return byKey;
      return LIST.findIndex((w) => w.id === h || w.name.toLowerCase() === h);
    }
    window.addEventListener('hashchange', () => {
      const i = hashIndex();
      if (i >= 0) switchTo(i);
    });

    // build switcher
    const seg = document.getElementById('seg');
    LIST.forEach((wp, i) => {
      const b = document.createElement('button');
      b.innerHTML = '<span class="t">' + wp.name + '</span><span class="n">' + String(i + 1).padStart(2, '0') + '</span>';
      b.addEventListener('click', () => switchTo(i));
      seg.appendChild(b);
    });

    // ---- controls ----
    const hideBtn = document.getElementById('hide');
    function toggleUI() { document.body.classList.toggle('ui-hidden'); }
    hideBtn.addEventListener('click', toggleUI);
    document.getElementById('peek').addEventListener('click', () => {
      document.body.classList.remove('ui-hidden');
    });

    // fullscreen
    const fsBtn = document.getElementById('fs');
    fsBtn.addEventListener('click', () => {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen().catch(() => {});
    });

    // download the current frame as a wallpaper PNG
    const saveBtn = document.getElementById('save');
    saveBtn.addEventListener('click', () => {
      if (!active) return;
      active.render(env);          // fresh frame in the buffer for toBlob
      canvas.toBlob((b) => {
        if (!b) return;
        const a = document.createElement('a');
        a.href = URL.createObjectURL(b);
        a.download = 'bk-wallpaper-' + ORDER[curIdx] + '.png';
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 3000);
      }, 'image/png');
    });

    // auto-cycle (screensaver) mode
    const autoBtn = document.getElementById('auto');
    let auto = false;
    autoBtn.addEventListener('click', () => {
      auto = !auto;
      autoBtn.classList.toggle('on', auto);
    });

    // hue dial: re-tints any shader via a CSS hue-rotate on the canvas
    const hueInput = document.getElementById('hue');
    function applyHue(v) { canvas.style.filter = (+v) ? 'hue-rotate(' + v + 'deg)' : ''; }
    hueInput.addEventListener('input', () => {
      applyHue(hueInput.value);
      try { localStorage.setItem('wp.hue', hueInput.value); } catch (e) {}
    });
    document.getElementById('hueCtl').addEventListener('dblclick', () => {
      hueInput.value = 0; applyHue(0);
      try { localStorage.setItem('wp.hue', '0'); } catch (e) {}
    });
    try { const sh = localStorage.getItem('wp.hue'); if (sh) { hueInput.value = sh; applyHue(sh); } } catch (e) {}

    // microphone reactivity: level drives u_speed, bass beats fire pulses
    const micBtn = document.getElementById('mic');
    let audio = null;
    async function toggleMic() {
      if (audio) {
        audio.stream.getTracks().forEach((tr) => tr.stop());
        audio.ctx.close();
        audio = null;
        micBtn.classList.remove('on');
        return;
      }
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return;
      try {
        const stream = await navigator.mediaDevices.getUserMedia({
          audio: { echoCancellation: false, noiseSuppression: false },
        });
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const analyser = ctx.createAnalyser();
        analyser.fftSize = 256;
        ctx.createMediaStreamSource(stream).connect(analyser);
        audio = { ctx, stream, analyser, data: new Uint8Array(analyser.frequencyBinCount), bands: new Float32Array(24), bassAvg: 0, bassSm: 0, lastBeat: -10 };
        micBtn.classList.add('on');
      } catch (e) {
        micBtn.textContent = 'MIC ✕';
        setTimeout(() => { micBtn.textContent = 'MIC'; }, 1600);
      }
    }
    micBtn.addEventListener('click', toggleMic);

    window.addEventListener('keydown', (e) => {
      if (e.target && e.target.tagName === 'INPUT') return;
      if (e.key === 'h' || e.key === 'H') toggleUI();
      else if (e.key === 'f' || e.key === 'F') fsBtn.click();
      else if (e.key === 'a' || e.key === 'A') autoBtn.click();
      else if (e.key === 's' || e.key === 'S') saveBtn.click();
      else if (e.key === 'm' || e.key === 'M') toggleMic();
      else if (e.key >= '1' && e.key <= '9') switchTo(parseInt(e.key, 10) - 1);
      else if (e.key === '0') switchTo(9);
      else if (e.key === 'ArrowRight') switchTo((curIdx + 1) % LIST.length);
      else if (e.key === 'ArrowLeft') switchTo((curIdx + LIST.length - 1) % LIST.length);
    });

    // ---- main loop ----
    let time = 0, start = performance.now(), prev = start;
    const meter = document.querySelector('#meter > i');
    let raf = null;

    let nextDriftClick = 10;

    function frame(now) {
      time = (now - start) / 1000;
      env.dt = Math.min(0.05, (now - prev) / 1000); prev = now;
      env.time = time;

      // screensaver: after a few idle seconds the cursor drifts on its own
      const idle = (now - lastRealInput) / 1000;
      if (idle > 6) {
        const dtT = time * 0.5;
        curN = [
          0.5 + 0.34*Math.sin(dtT*0.26) + 0.10*Math.sin(dtT*0.83),
          0.5 + 0.30*Math.sin(dtT*0.21 + 1.7) + 0.08*Math.cos(dtT*0.67),
        ];
        curPx = [curN[0]*W, (1 - curN[1])*H];
        if (time > nextDriftClick) {
          input.click.pos = curN.slice();
          input.click.energy = 0.9;
          clickStart = time;
          nextDriftClick = time + 6 + Math.random()*8;
        }
      }

      // auto-cycle mode: next shader every 45 seconds
      if (auto && time - lastSwitch > 45 && !fading) switchTo((curIdx + 1) % LIST.length);

      // velocity + smoothed speed
      const velN = [curN[0] - lastN[0], curN[1] - lastN[1]];
      const velPx = [curPx[0] - lastPx[0], curPx[1] - lastPx[1]];
      const rawSpeed = Math.min(1.5, Math.hypot(velPx[0], velPx[1]) / (35 * dpr));
      input.speed += (rawSpeed - input.speed) * 0.25;
      input.mouse = curN; input.pmouse = lastN.slice();
      input.vel = velN; input.velPx = velPx;
      input.mousePx = curPx.slice();
      lastN = curN.slice(); lastPx = curPx.slice();

      // audio drive: level feeds u_speed, bass beats fire click pulses, and a
      // 24-band smoothed spectrum is published for shaders that want it all
      if (audio) {
        audio.analyser.getByteFrequencyData(audio.data);
        let sum = 0, bass = 0;
        const n = audio.data.length;
        for (let i = 0; i < n; i++) sum += audio.data[i];
        for (let i = 1; i < 9; i++) bass += audio.data[i];
        const level = sum / (n * 255), bl = bass / (8 * 255);
        input.speed = Math.max(input.speed, level * 2.4);
        for (let b = 0; b < 24; b++) {
          const i0 = 1 + Math.floor(Math.pow(b / 24, 1.6) * (n - 2));
          const i1 = 1 + Math.floor(Math.pow((b + 1) / 24, 1.6) * (n - 2));
          let m = 0;
          for (let i = i0; i <= Math.max(i0, i1); i++) m = Math.max(m, audio.data[i]);
          audio.bands[b] = Math.max(audio.bands[b] * 0.86, Math.min(1, (m / 255) * 1.25));
        }
        audio.bassSm = audio.bassSm * 0.72 + Math.min(1, bl * 1.7) * 0.28;
        audio.bassAvg = audio.bassAvg * 0.985 + bl * 0.015;
        if (bl > audio.bassAvg * 1.4 + 0.05 && time - audio.lastBeat > 0.28) {
          audio.lastBeat = time;
          input.click.pos = curN.slice();
          input.click.energy = Math.max(input.click.energy, Math.min(1, bl * 1.8));
          clickStart = time;
        }
        env.audio = { on: true, level, bass: audio.bassSm, bands: audio.bands, beatAge: time - audio.lastBeat };
      } else env.audio = null;

      // click decay
      input.click.energy *= 0.96;
      if (input.click.energy < 0.001) input.click.energy = 0;
      input.clickAge = time - clickStart;

      meter.style.width = Math.min(100, input.speed * 80) + '%';

      if (active) active.render(env);
      raf = requestAnimationFrame(frame);
    }
    // pause when tab hidden
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) { if (raf) cancelAnimationFrame(raf); raf = null; }
      else if (!raf) { prev = performance.now(); raf = requestAnimationFrame(frame); }
    });

    // ---- boot ----
    resize();
    let startIdx = 0;
    const hi = hashIndex();
    if (hi >= 0) startIdx = hi;
    else try { const saved = localStorage.getItem('wp.active'); const si = ORDER.indexOf(saved); if (si >= 0) startIdx = si; } catch (e) {}
    activate(startIdx, false);
    raf = requestAnimationFrame(frame);
  })();
  </script>
</body>
</html>
